<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nexauren Music — a future focused experience for sample packs, MIDI, presets and producer products.">
  <meta name="theme-color" content="#f7eee9">
  <title>Nexauren Music — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f8efe9;--paper:#fffaf6;--ink:#2b2930;--muted:#736f74;--accent:#b76f59;--line:#eadbd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.shell{width:min(1040px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:rgba(248,239,233,.9);backdrop-filter:blur(12px)}.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:.65rem;font-weight:800;letter-spacing:.14em;font-size:.8rem}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:"Playfair Display",serif;font-size:1.05rem;letter-spacing:0}.back{font-size:.84rem;color:#5e5a60}.back:hover{text-decoration:underline}.hero{min-height:680px;display:grid;place-items:center;text-align:center;padding:80px 0}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800;color:#8a7770}.hero h1{max-width:780px;margin:1rem auto 0;font-family:"Playfair Display",serif;font-size:clamp(3.5rem,8vw,6.3rem);line-height:.98;letter-spacing:-.05em}.hero h1 span{color:var(--accent)}.hero p{max-width:600px;margin:1.5rem auto 0;color:var(--muted);font-size:1.03rem}.badge{display:inline-flex;align-items:center;gap:.45rem;margin-top:2rem;padding:.5rem .8rem;border:1px solid var(--line);border-radius:999px;background:rgba(255,250,246,.75);font-size:.77rem;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#aa8a66}.teaser{margin:3rem auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;max-width:800px}.tile{min-height:150px;border:1px solid var(--line);border-radius:22px;padding:1.1rem;text-align:left;background:var(--paper)}.tile span{font-size:.7rem;color:#8d7f79}.tile strong{display:block;margin-top:3rem;font-size:1.02rem}.footer{border-top:1px solid var(--line);padding:1.2rem 0;color:#7b7577;font-size:.75rem;display:flex;justify-content:space-between}@media(max-width:700px){.teaser{grid-template-columns:1fr}.hero{padding:60px 0}.footer{flex-direction:column;gap:.4rem}}
  </style>
</head>
<body>
  <header><div class="shell nav"><a class="brand" href="../"><span class="mark">N</span>NEXAUREN MUSIC</a><a class="back" href="../">Back to Nexauren</a></div></header>
  <main class="shell hero"><div><div class="eyebrow">NEXAUREN MUSIC</div><h1>Made for the <span>sound.</span></h1><p>Sample packs, MIDI, presets, loops and producer-focused digital products will have their own storefront and their own experience.</p><div class="badge"><span class="dot"></span> Coming soon</div><div class="teaser"><div class="tile"><span>01</span><strong>Sample Packs</strong></div><div class="tile"><span>02</span><strong>MIDI & Loops</strong></div><div class="tile"><span>03</span><strong>Presets & Kits</strong></div></div></div></main>
  <footer class="shell footer"><span>© <span id="year"></span> Nexauren Music</span><a href="../legal/privacy.html">Privacy</a></footer>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
