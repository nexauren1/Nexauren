<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>NexaurenBooks · Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../admin.css">
</head>
<body class="admin-auth-page">
  <main class="auth-layout">
    <a class="brand auth-brand" href="../../">
      <span class="brand-mark">N</span>
      <span class="brand-text"><strong>NEXAURENBOOKS</strong><small>ACESSO PRIVADO</small></span>
    </a>
    <section class="auth-card">
      <span class="eyebrow">ESPAÇO PRIVADO</span>
      <h1>Aceder ao Admin</h1>
      <p>Usa a conta com o papel de administrador.</p>
      <form id="admin-login-form" class="auth-form">
        <label>Email<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>Palavra-passe<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-primary button-wide" type="submit">Entrar</button>
        <p id="login-status" class="inline-status" role="status" aria-live="polite"></p>
      </form>
      <div class="auth-badges"><span>Servidor protegido</span><span>Sessão segura</span><span>Papel admin</span></div>
    </section>
    <a class="auth-back" href="../../">Voltar à Nexauren</a>
  </main>
</body>
</html>
